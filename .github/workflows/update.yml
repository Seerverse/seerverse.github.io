name: update
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update.py
      - name: commit if changed
        run: |
          git diff --quiet -- data/ && exit 0
          git config user.name "0xSeerBear"
          git config user.email "0xSeerBear@users.noreply.github.com"
          git add data/profile.json
          git commit -m "data: daily profile sync"
          git push
